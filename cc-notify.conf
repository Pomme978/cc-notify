# Configuration de cc-notify. Sourcé par cc-notify.sh à chaque notification,
# donc relu immédiatement : rien à redémarrer après modification.

# Interrupteur général. 0 pour tout couper sans désinstaller.
ENABLED=1

# Le silence de fin de tour demande DEUX conditions réunies : le tour a duré
# moins de MIN_DURATION secondes, ET la machine a été touchée il y a moins de
# MIN_IDLE secondes. Autrement dit, on se tait seulement si c'était rapide et
# que vous étiez là. Un tour court pendant votre absence déclenche quand même
# une notification, et un tour long aussi — vous tapiez sans doute ailleurs.
MIN_DURATION=30
MIN_IDLE=30

# Un sous-agent dont on n'a plus aucune nouvelle depuis ce délai est réputé
# mort. Garde-fou : sans lui, un SubagentStop perdu condamnerait tout le reste
# du tour au silence. En secondes.
AGENT_TTL=600

# Longueur maximale du corps de la notification, en caractères.
BODY_LEN=120

# Sons macOS. Liste disponible dans /System/Library/Sounds.
SOUND_DONE=Ping
SOUND_QUESTION=Glass
SOUND_ERROR=Basso

# 1 pour journaliser chaque événement et chaque décision dans
# ~/.claude/state/cc-notify/log. Le journal est tronqué à ses 2000 dernières
# lignes dès qu'il dépasse LOG_MAX_BYTES.
DEBUG=0
LOG_MAX_BYTES=500000

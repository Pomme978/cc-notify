# Configuration de cc-notify. Sourcé par cc-notify.sh.
# Modifier ici, pas dans le script.

# Interrupteur général. 0 pour tout couper sans désinstaller.
ENABLED=1

# Un tour plus court que ceci ne déclenche pas de notification de fin :
# vous étiez très probablement devant l'écran. En secondes.
MIN_DURATION=30

# Longueur maximale du corps de la notification, en caractères.
BODY_LEN=120

# Sons macOS. Liste disponible dans /System/Library/Sounds.
SOUND_DONE=Ping
SOUND_QUESTION=Glass
SOUND_ERROR=Basso

# 1 pour journaliser chaque décision dans ~/.claude/state/cc-notify/log
DEBUG=1

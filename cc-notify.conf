# Configuration de cc-notify. Sourcé par cc-notify.sh à chaque notification,
# donc relu immédiatement : rien à redémarrer après modification.

# Interrupteur général. 0 pour tout couper sans désinstaller.
ENABLED=1

# Le silence de fin de tour demande DEUX conditions réunies : le tour a duré
# moins de MIN_DURATION secondes, ET la machine a été touchée il y a moins de
# MIN_IDLE secondes. Autrement dit, on se tait seulement si c'était rapide et
# que vous étiez là. Un tour court pendant votre absence déclenche quand même
# une notification, et un tour long aussi — vous tapiez sans doute ailleurs.
MIN_DURATION=30
MIN_IDLE=30

# Un sous-agent dont on n'a plus aucune nouvelle depuis ce délai est réputé
# mort. Garde-fou : sans lui, un SubagentStop perdu condamnerait tout le reste
# du tour au silence. En secondes.
AGENT_TTL=600

# Longueur maximale du corps de la notification, en caractères.
BODY_LEN=120

# Sons macOS. Liste disponible dans /System/Library/Sounds.
SOUND_DONE=Ping
SOUND_QUESTION=Glass
SOUND_ERROR=Basso

# Escalade vers le téléphone. Si une notification reste sans réaction pendant
# ESCALATE_AFTER secondes, un push part via ntfy.sh. Toute réaction l'annule :
# réponse dans la bannière, clic dessus, ou nouveau message tapé dans la session.
#
# Vide = désactivé, rien ne sort de la machine.
#
# ATTENTION : ntfy.sh est un service public sans authentification. Quiconque
# connaît le nom du sujet lit vos notifications, et le titre de session y part
# en clair. Choisir un nom long et imprévisible, par exemple avec
#     openssl rand -hex 16
# ou pointer NTFY_SERVER vers une instance que vous hébergez.
NTFY_TOPIC=
NTFY_SERVER=https://ntfy.sh
ESCALATE_AFTER=300

# Emojis collés au titre du push, séparés par des virgules. Vide = aucun.
# Codes valides sur https://ntfy.sh/docs/emojis/ — par exemple :
#   white_check_mark  ✅   question  ❓   rotating_light  🚨
# Sur iPhone c'est le seul repère visuel disponible : ntfy iOS ne sait pas
# afficher d'icône personnalisée.
NTFY_TAGS=

# URL d'une icône PNG ou JPEG accessible publiquement. ANDROID UNIQUEMENT :
# ntfy iOS ignore cet en-tête. Vide = icône par défaut de l'application ntfy.
NTFY_ICON=

# 1 pour journaliser chaque événement et chaque décision dans
# ~/.claude/state/cc-notify/log. Le journal est tronqué à ses 2000 dernières
# lignes dès qu'il dépasse LOG_MAX_BYTES.
DEBUG=0
LOG_MAX_BYTES=500000
